# Rebuilds didtheworldendtoday.com every 15 minutes and on every push to main.
name: update

on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SITE_URL: https://didtheworldendtoday.com

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # ref: the branch itself, not the commit that triggered the run, so a run
      # that waited behind another one starts from the newest main.
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The X token is visible to this step and no other.
      - name: Update data
        run: npm run update
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_DAILY_BUDGET_USD: ${{ vars.X_DAILY_BUDGET_USD }}

      # The Anthropic key is visible to this step and no other. The editor catches
      # everything and exits 0, so a bad night here never stops the build. The key was
      # first saved as NTHROPIC_API_KEY, its A missing, so either name works.
      - name: Write today's edition
        run: npm run edit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.NTHROPIC_API_KEY }}

      # Saved before the build and the tests, so a run that fails there still keeps its data
      # and the editor's call count.
      - name: Commit data if it changed
        run: |
          set +e
          node scripts/data-changed.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            msg="data: $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET"
            git config user.name "thelpdrive bot"
            git config user.email "bot@didtheworldendtoday.com"
            git add data
            git commit -m "$msg"
            this_run="$(git rev-parse HEAD)"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              for attempt in 1 2 3; do
                if git fetch --depth=50 origin main; then
                  if ! git rebase origin/main; then
                    # Only data/ can conflict. The files this run changed are the newest reading, so they win. Every other
                    # file stays as the other run left it, so nothing it added or changed is lost.
                    git rebase --abort
                    git reset --hard origin/main
                    git diff-tree --no-commit-id --name-status -r "$this_run" | while IFS=$'\t' read -r change file; do
                      if [ "$change" = "D" ]; then git rm -q --ignore-unmatch -- "$file"; else git checkout "$this_run" -- "$file"; fi
                    done
                    git commit -m "$msg" || true
                  fi
                  if git push; then
                    exit 0
                  fi
                fi
                sleep 5
              done
              echo "::warning::Could not push the data commit after 3 tries. The site still deploys from this run."
            else
              echo "Not on main, data commit stays local."
            fi
          elif [ "$status" -ne 3 ]; then
            echo "::warning::Could not tell whether data changed (exit $status). Skipping the data commit."
          fi

      - name: Build site
        run: npm run build

      - name: Test
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
